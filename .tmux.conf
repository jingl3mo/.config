# remap keys
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind '%'

# switch windows with alt+number
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# alt-direction to swtich panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -s escape-time 0
set -g mode-keys vi
set -g mouse on
set -g status on
set -g focus-events on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#latest'

# for vim
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# auto-save in minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '128'

# catppuccin theming
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'slanted'
set -g @catppuccin_pane_border_status 'on'
set -g @catppuccin_window_status 'icon'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text "%Y-%m-%dT%H:%M"
set -g @catppuccin_uptime_text "#(uptime | sed -E 's/^[^,]*up *//; s/, *[0-9]* user.*//; s/ day.*, */D/; s/ *mins?/M/; s/ *hrs?/H/; s/([0,9]{1,2}):([0,9]{1,2})/\\1H\\2M; s/D([0-9])/DT\\1/; s/^([0-9])T\\1/; s/^/P/')"

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right-length 128
set -gF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_uptime}#{E:@catppuccin_status_date_time}#{E:@catppucin_status_user}"

# setup plugins
run '~/.tmux/plugins/tpm/tpm'

